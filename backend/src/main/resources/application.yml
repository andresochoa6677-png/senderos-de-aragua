spring:
  application:
    name: senderos-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/senderos}
    username: ${DB_USERNAME:senderos}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Correo: los valores vienen de variables de entorno (MAIL_*).
  # Sin MAIL_HOST definido no se crea el cliente SMTP; el modo captura
  # no lo necesita. Con MAIL_MODO=smtp + credenciales, el envio es real.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  web:
    resources:
      static-locations: classpath:/static/,file:uploads/

server:
  port: 8080
  error:
    include-message: never
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        # secure: true en produccion (perfil 'prod'); false en local para HTTP
        secure: ${COOKIE_SECURE:false}
        max-age: 12h

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Tasa límite en memoria de los endpoints públicos de escritura
  # (login, registro, reset, verificación). Suficiente para un nodo con
  # ~200 usuarios; no usar en despliegue multi-instancia.
  rate-limiter:
    max-intentos: ${RATE_LIMIT_MAX_INTENTOS:10}
    ventana-minutos: ${RATE_LIMIT_VENTANA_MINUTOS:10}
  # Cuentas nacidas PENDIENTE que no verifican su correo en este plazo se
  # eliminan y su vuelve a liberar la vivienda (LimpiezaCuentasService).
  limpieza:
    dias-pendiente: ${LIMPIEZA_DIAS_PENDIENTE:7}
  # URL pública del frontend: base de los enlaces de verificación y recuperación.
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    # captura (dev/test): guarda correos en correo-saliente/ y memoria.
    # smtp (produccion): envio real via spring.mail.* por variables MAIL_*.
    modo: ${MAIL_MODO:captura}
    from: ${MAIL_FROM:no-reply@senderos.local}
    from-name: ${MAIL_FROM_NAME:Senderos de Aragua}
    captura-dir: ${MAIL_CAPTURA_DIR:correo-saliente}
  password-reset:
    # Solo para desarrollo local sin mailer: registra el token en el log.
    # JAMAS habilitar en produccion (application-prod.yml lo fuerza a false).
    log-token: ${PASSWORD_RESET_LOG_TOKEN:false}
  verificacion-email:
    # Igual criterio que password-reset: log del token solo en desarrollo.
    log-token: ${PASSWORD_VERIFICATION_LOG_TOKEN:false}

logging:
  level:
    com.senderos: INFO
    org.springframework.security: INFO

