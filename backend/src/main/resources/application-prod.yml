server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
        max-age: 12h
  error:
    include-message: never
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # Produccion: sin valores por defecto para secretos. Si falta alguna
  # variable de entorno la aplicacion NO arranca (fail-fast).
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # SMTP autenticado con STARTTLS (estándar para proveedores transaccionales).
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    properties:
      hibernate:
        session:
          events:
            log: QUIET

app:
  cors:
    # En produccion el origen debe declararse explicitamente por variable de entorno.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  base-url: ${APP_BASE_URL}
  mail:
    modo: ${MAIL_MODO:smtp}
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:Senderos de Aragua}
  password-reset:
    log-token: false
  verificacion-email:
    log-token: false
